# /etc/nginx/snippets/kalkulyator.conf
# Mavjud HTTPS server { ... } bloki ichiga qo'shiladi:
#     include snippets/kalkulyator.conf;

# Oxirida "/" siz kirilsa — yo'naltiramiz. Aks holda sahifadagi nisbiy yo'llar
# (style.css, app.js, api/installments) /kalkulyator/ emas, domen ildiziga ketadi.
location = /kalkulyator {
    return 301 /kalkulyator/;
}

# ^~ — server blokidagi regex location'lar (masalan, "location ~* \.(js|css)$" keshlash
# qoidasi) /kalkulyator/app.js ni "tortib olmasligi" uchun.
location ^~ /kalkulyator/ {
    # Oxiridagi "/" muhim: /kalkulyator/ prefiksi olib tashlanib, ilovaga /... bo'lib boradi.
    proxy_pass http://127.0.0.1:3100/;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Ilova o'zi 1 KB dan katta tanani 413 bilan rad etadi; bu — ortiqchasini Nginx'da to'xtatish
    client_max_body_size 16k;

    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
}
